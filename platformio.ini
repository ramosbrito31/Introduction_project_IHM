; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lolin32
; O linker do ESP32 não abre caminhos com acento (como "Área de Trabalho"),
; então os arquivos de compilação ficam fora da pasta do projeto.
build_dir = ${platformio.core_dir}/build/reflow

[env:lolin32]
platform = espressif32
board = lolin32
framework = arduino
board_build.filesystem = littlefs
; 3 MB para o programa (com a tabela padrão, ele ocupava 99,9% do espaço). Sem OTA.
board_build.partitions = huge_app.csv
test_ignore = *
lib_deps =
  mathieucarbou/ESPAsyncWebServer
  bblanchon/ArduinoJson

; Testes do controle no PC, sem a placa: pio test -e native
[env:native]
platform = native
test_framework = unity
